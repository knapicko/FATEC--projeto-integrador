name: consertaja
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_multi_formatter: ^2.10.0
  supabase_flutter: ^2.12.4
  google_sign_in: ^7.2.0
  http: ^1.2.1
  path_provider: ^2.1.5

  camera: ^0.12.0+2
  permission_handler: ^13.0.0
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  crypto: ^3.0.3
  image_picker: ^1.2.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Logo.png" 
  


flutter:

  uses-material-design: true
 
  assets:
    - assets/images/
    - assets/images/oficios/
    - assets/images/oficios_imgs/
