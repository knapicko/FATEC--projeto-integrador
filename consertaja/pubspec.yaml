name: consertaja
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_multi_formatter: ^2.10.0
  supabase_flutter: ^2.12.4
  google_sign_in: ^6.2.1
